    name: uottawa.ca Content JSON:API
    x-operator: institution
    description: >-
      Undocumented, anonymously readable JSON:API 1.0 surface on the University of Ottawa's own
      Drupal web platform. Probed 2026-09-01: https://www.uottawa.ca/jsonapi returns HTTP 200
