  - aid: university-of-ottawa:caf-idp
    name: uOttawa Shibboleth Identity Provider (Canadian Access Federation)
    x-operator: institution
    description: >-
      The University of Ottawa's own SAML 2.0 identity provider and its published federation
      metadata. Probed 2026-09-01: https://fca-caf.uottawa.ca/idp/shibboleth returns HTTP 200
      application/xml (7,299 bytes) with entityID https://fca-caf.uottawa.ca/idp, an
      IDPSSODescriptor, shibmd:Scope uottawa.ca, and SAML 2.0 SSO endpoints for HTTP-POST,
      HTTP-Redirect and POST-SimpleSign plus SOAP artifact resolution on port 8443. The entity
      appears in the eduGAIN aggregate (entity 678487) with registration authority
      http://www.canarie.ca - the Canadian Access Federation. The host resolves to
      137.122.8.144, inside uOttawa's own allocation. This is institution-operated identity
      infrastructure, not a vendor surface, and it is the strongest machine-readable surface
      the institution runs.
