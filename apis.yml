apis:
  - aid: university-of-ottawa:ruor-rest
    name: uO Research DSpace REST API
    x-operator: institution
    description: >-
      Public DSpace 8.3 REST/HATEOAS API for uO Research (Recherche uO Research), the
      University of Ottawa Library's self-hosted institutional repository. Probed 2026-09-01:
      the root returns HTTP 200 application/hal+json with dspaceVersion "DSpace 8.3",
      dspaceName "Recherche uO Research" and 79 HAL link relations. Communities and collections
      read anonymously; /core/items and /core/bitstreams return 401, so public discovery goes
      through /discover/search/objects. The host resolves to 137.122.5.61, inside uOttawa's own
      IP allocation - the software is open-source DSpace, the deployment and the content are
      the institution's. uOttawa publishes no OpenAPI for it; the spec here was written by API
      Evangelist from live probes.
