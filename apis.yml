x-coverage:
  state: covered
  reason: covered
  detail: >-
    Operator attribution was settled by live probe on 2026-09-01 before anything was saved.
    Four institution-operated surfaces were confirmed on uOttawa's own hosts - the uO Research
    DSpace 8.3 REST API and its OAI-PMH 2.0 provider (ruor.uottawa.ca, 137.122.5.61), an
    undocumented but anonymously readable Drupal JSON:API on www.uottawa.ca, and the
    institution's own Shibboleth SAML 2.0 identity provider (fca-caf.uottawa.ca, 137.122.8.144)
    registered in the Canadian Access Federation by CANARIE and present in eduGAIN. None of the
    four ships an OpenAPI, so every spec in openapi/ is marked probed and attributed to API
    Evangelist, not to uOttawa. Three vendor-operated surfaces are recorded as tenant
    relationships and never as uOttawa contracts: Leepfrog CourseLeaf (catalogue.uottawa.ca
    CNAMEs to uottawa-ca-public.courseleaf.com, and its ribbit endpoint returns real uOttawa
    course data), Borealis Dataverse (collection "ottawa", id 41131), and Ex Libris Primo VE
    via OCUL (ocul-uo.primo.exlibrisgroup.com). Three registry memberships are recorded as
    facts about the institution - DataCite UOTT / uott.library / prefix 10.20381, Crossref
    members 7569 and 16151, ROR 03c4mmv16 - without saving any registry's contract. Deliberate
    exclusions: uottawa.maps.arcgis.com resolves and returns an ArcGIS Online portal with
    urlKey "uottawa", but the org is access "private" and anonymous probing cannot confirm
    ownership or reach any public content, so it is not claimed; status.uottawa.ca CNAMEs to
    uottawastatus.tumblr.com and fails TLS for that hostname, so it is not listed as a status
    pointer. Absences confirmed by negative probe rather than assumed: no developer portal
    (developer.uottawa.ca NXDOMAIN), no API gateway (api.uottawa.ca NXDOMAIN), no open-data
    portal (data.uottawa.ca and opendata.uottawa.ca NXDOMAIN), no institution-run HPC surface
    (hpc.uottawa.ca NXDOMAIN; uOttawa researchers use the national Digital Research Alliance of
    Canada), no llms.txt, no security.txt, no OIDC discovery document, no changelog and no
    status page. One catalog correction: the previous profile recorded DSpace 7.6.5 from
    2026-06-03; the live root now reports DSpace 8.3.
  generated: '2026-09-01'
  method: probed
