      content model (node--faculty, node--campus_life, node--content_hub, media--*,
      taxonomy_term--*), and /node/article returns real published articles. The index
      over-advertises - /node/event is listed but returns an HTML 404 - and uOttawa documents
      none of it, links to it from no developer page, and publishes no llms.txt governing its
      use. Recorded here because it is real, institution-operated and callable today.
