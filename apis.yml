aid: university-of-ottawa
name: University of Ottawa
x-type: university
x-category: Public Research University
description: >-
  The University of Ottawa (uOttawa / Universite d'Ottawa) is a public bilingual research
  university in Ottawa, Ontario, Canada, and the largest English-French bilingual university in
  the world. Its programmable footprint is small, undocumented, and almost entirely a
  by-product of the platforms it runs rather than anything it sells or supports: uOttawa
  publishes no developer portal, no API gateway, no OpenAPI, no llms.txt and no security.txt,
  and api.uottawa.ca and developer.uottawa.ca do not resolve. What it does operate itself, on
  its own hosts, is worth naming precisely. uO Research (Recherche uO Research) at
  ruor.uottawa.ca is a self-hosted DSpace 8.3 institutional repository exposing a public
  REST/HATEOAS API and an OAI-PMH 2.0 provider with fourteen metadata formats; www.uottawa.ca
  serves an undocumented but fully anonymous Drupal JSON:API surface advertising 287 resource
  types; and fca-caf.uottawa.ca runs the institution's own Shibboleth SAML 2.0 identity
  provider, registered in the Canadian Access Federation by CANARIE and interfederated through
  eduGAIN. Everything else that looks like a uOttawa API belongs to a vendor: the Omni library
  discovery layer is Ex Libris Primo VE via the OCUL consortium, the course catalogue at
  catalogue.uottawa.ca is Leepfrog CourseLeaf (CNAME uottawa-ca-public.courseleaf.com), and the
  research-data collection is a Borealis (Dataverse) tenancy. Those are recorded here as tenant
  relationships, never as uOttawa contracts. The institution is also a registrant in three
  identifier registries - DataCite (member UOTT, repository uott.library, prefix 10.20381),
  Crossref (members 7569 and 16151), and ROR (03c4mmv16) - which is a fact about uOttawa even
  though the registries' own APIs are not.
